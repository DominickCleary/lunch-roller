name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: lunch
          POSTGRES_PASSWORD: lunch
          POSTGRES_DB: lunch_roller
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lunch -d lunch_roller"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://lunch:lunch@localhost:5432/lunch_roller
      TEST_DATABASE_URL: postgres://lunch:lunch@localhost:5432/lunch_roller
      ADMIN_PASSWORD: integration-only-password
      SESSION_SECRET: integration-only-session-secret-at-least-32-characters
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/check-worker.mjs
      - run: node scripts/check-worker.mjs --push-config
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: curl --fail http://localhost:3000/api/v1/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
